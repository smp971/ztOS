# The validated Note9 CS47L93/ABOX input lives at PCM device 2, which the
# speaker card's default ALSA profile does not open. Idle means no recording.
context.objects = [
    { factory = adapter
      args = {
        factory.name = api.alsa.pcm.source
        node.name = "crown-microphone"
        node.description = "Note9 microphone"
        media.class = "Audio/Source"
        api.alsa.path = "hw:ZrnAbox,2"
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.period-size = 1024
        api.alsa.headroom = 0
        node.suspend-on-idle = true
        session.suspend-timeout-seconds = 3
        priority.session = 2000
        priority.driver = 2000
      }
    }
]
